name: StrongBody Daily Test

on:
  push:
    branches: [main]
  schedule:
    # 06:10 sáng VN (GMT+7) = 23:10 UTC đêm hôm trước
    - cron: '10 23 * * *' 

  workflow_dispatch:
    inputs:
      environment:
        description: 'CHỌN MÔI TRƯỜNG (Chỉ áp dụng khi chạy thủ công)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - live
      spec:
        description: 'Đường dẫn file test (Ví dụ: cypress/test/login.cy.js)'
        required: false
        default: ''

jobs:
  # NHIỆM VỤ 1: CHẠY TRÊN BẢN TEST (vercel.app)
  test-environment:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chạy Cypress trên bản TEST
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=https://strongbody-web.vercel.app/
          # ĐÃ SỬA: Chuyển e2e thành test để khớp với thư mục máy của bạn
          spec: ${{ github.event.inputs.spec || 'cypress/test/login.cy.js,cypress/test/become_seller.cy.js,cypress/test/add_product.cy.js,cypress/test/write_blog.cy.js' }}

      - name: Lưu ảnh lỗi bản TEST
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-test-env
          path: cypress/screenshots
          retention-days: 7

  # NHIỆM VỤ 2: CHẠY TRÊN BẢN LIVE (strongbody.ai)
  live-environment:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'live')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chạy Cypress trên bản LIVE
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=https://strongbody.ai/
          # ĐÃ SỬA: Chuyển e2e thành test để khớp với thư mục máy của bạn
          spec: ${{ github.event.inputs.spec || 'cypress/test/login.cy.js' }}

      - name: Lưu ảnh lỗi bản LIVE
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-live-env
          path: cypress/screenshots
          retention-days: 7

      - name: Tải lên video (Luôn lưu)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7