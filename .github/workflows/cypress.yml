name: StrongBody Daily Test

on:
  push:
    branches: [main]
  # schedule:
  #   # 06:10 sáng VN (GMT+7) = 23:10 UTC đêm hôm trước
  #   - cron: '0 23 * * *' 

  workflow_dispatch:
    inputs:
      environment:
        description: 'CHỌN MÔI TRƯỜNG (Mặc định là test)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - live
      spec:
        description: 'Đường dẫn file test (Để trống sẽ chạy TOÀN BỘ)'
        required: false
        default: ''

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập URL môi trường
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" == "live" ]; then
            echo "BASE_URL=https://strongbody.ai/" >> $GITHUB_ENV
            echo "Môi trường: LIVE"
          else
            echo "BASE_URL=https://strongbody-web.vercel.app/" >> $GITHUB_ENV
            echo "Môi trường: TEST (Mặc định)"
          fi

      - name: Chạy Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=${{ env.BASE_URL }}
          # Chạy toàn bộ file trong cypress/test/ nếu không chỉ định file cụ thể
          spec: ${{ github.event.inputs.spec || 'cypress/test/**/*.cy.js' }}

      - name: Lưu ảnh lỗi (Nếu có)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Lưu video (Luôn lưu)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7